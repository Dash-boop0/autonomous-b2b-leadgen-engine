# docker compose up --build  ->  Postgres + API (migrates + seeds on start) + web.
# Project name "leadgen" keeps containers/volumes separate from other stacks on the same machine.
name: leadgen

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen   # local demo only
      POSTGRES_DB: leadgen
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://leadgen:leadgen@db:5432/leadgen
      APP_MODE: demo
      SECRET_KEY: ${SECRET_KEY:-compose-demo-only-secret}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      SEED_PROFILE: ${SEED_PROFILE:-basic}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
