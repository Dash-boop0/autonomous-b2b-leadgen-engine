name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12 and dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt "pytest>=8,<9" "ruff>=0.6"
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Pytest
        run: .venv/bin/pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadgen
          POSTGRES_PASSWORD: leadgen
          POSTGRES_DB: leadgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadgen" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt "pytest>=8,<9"
      - name: E2E through the Vercel entry point on Postgres
        env:
          TEST_APP_ENTRY: api.index
          TEST_DATABASE_URL: postgresql://leadgen:leadgen@localhost:5432/leadgen
        run: .venv/bin/pytest tests/test_e2e_api.py tests/test_acceptance.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
