[project]
name = "leadgen-engine"
version = "0.1.0"
description = "Autonomous B2B lead-generation engine (mock providers, dry-run by default)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dns = ["dnspython>=2.6,<3"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
